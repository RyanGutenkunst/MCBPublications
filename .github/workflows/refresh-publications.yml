name: Refresh publications

# Fetches from OpenAlex, rebuilds the page, and publishes it to GitHub Pages.
# No external host is involved: Pages serves the built HTML directly.

on:
  schedule:
    # Weekly, Sunday night Arizona time: 10:17 PM Sunday MST = 05:17 UTC MONDAY.
    # Note the day-of-week is 1 (Monday), not 0 (Sunday) -- cron runs in UTC and
    # Arizona is UTC-7 (no DST), so Sunday evening here is already Monday there.
    # Using 0 would fire Sunday *morning*, a day early for a Monday meeting.
    # The :17 is deliberate: GitHub delays scheduled runs during the congestion
    # at :00. A delay of an hour or two still lands well inside Sunday night.
    - cron: "17 5 * * 1"
  workflow_dispatch:        # "Run workflow" button, for refreshing before a meeting

permissions:
  contents: write           # commit the refreshed data file
  pages: write              # publish to Pages
  id-token: write           # required by deploy-pages

# Never let two publishes overlap, but don't cancel one already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch publications and rebuild the page
        env:
          # A free key ($1/day, ~10,000 calls) is required here in practice:
          # without one the budget is tied to the runner's IP address, which is
          # shared with every other GitHub-hosted job and is routinely already
          # spent. Get one at https://openalex.org/settings/api
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        # Exits non-zero if OpenAlex is rate limited. That fails the job before
        # the deploy step, so the currently published page stays live.
        run: python3 update.py --title "MCB Recent Publications"

      - name: Commit the refreshed data
        # The HTML is deployed as an artifact and does not need committing, but
        # the JSON is worth keeping: it gives a history of what changed between
        # meetings, and the commit counts as repository activity, which keeps
        # GitHub from auto-disabling this schedule after 60 quiet days.
        run: |
          git config user.name "publications-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          if git diff --staged --quiet; then
            echo "No change in publications since the last run."
          else
            git commit -m "Refresh publications ($(date -u +%Y-%m-%d))"
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
